<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#141312;--kart:#1f1d1b;--tekst:#ECE7DF;--sery:#8f877d;--zh:#FDD300}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tekst);font:15px/1.35 -apple-system,Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(20,19,18,.94);backdrop-filter:blur(10px);padding:12px 12px 8px}
h1{margin:0 0 8px;font-size:20px;font-weight:700}h1 b{color:var(--zh)}
input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #333;background:#0e0d0c;color:var(--tekst);font-size:16px}
.zony{display:flex;gap:6px;overflow-x:auto;padding-top:8px}.zony button{flex:none;border:1px solid #3a3734;background:none;color:var(--sery);border-radius:20px;padding:5px 11px;font-size:13px}
.zony button.on{background:var(--zh);color:#111;border-color:var(--zh)}
.sort{display:flex;gap:6px;padding-top:6px}.sort button{border:0;background:none;color:var(--sery);font-size:13px;padding:3px 6px}.sort button.on{color:var(--zh);font-weight:700}
.k .z b{color:var(--zh);font-weight:600}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px 12px 40px}
.k{background:var(--kart);border-radius:12px;overflow:hidden;cursor:pointer}
.k .im{aspect-ratio:16/9;background:#0b0a09 center/cover no-repeat}
.k .t{padding:7px 9px 9px;font-size:13px;line-height:1.25}.k .z{color:var(--sery);font-size:11px;margin-top:3px}
#okno{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:10;display:none;overflow:auto;padding:14px}
#okno img,#okno video{width:100%;border-radius:10px;display:block;margin-bottom:12px;background:#000}
#zh{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000 center/cover no-repeat;margin-bottom:12px}
#zh iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
#zh .pol{position:absolute;left:0;bottom:0;height:3px;background:var(--zh);width:0}
#zh .zhd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sery);font-size:13px}
#okno h2{margin:0 0 6px;font-size:19px}#okno p{margin:0 0 10px;color:#cfc8bd}
#okno .tg{color:var(--sery);font-size:13px;margin-bottom:16px}
#okno button{width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;margin-bottom:8px}
#vzyat{background:var(--zh);color:#111;font-weight:700}#zakr{background:#2a2826;color:var(--tekst)}
.pusto{grid-column:1/-1;text-align:center;color:var(--sery);padding:40px}
</style></head><body>
<header><h1>Приёмы <b id="n"></b></h1><input id="q" placeholder="Поиск: титр, карта, чат…" autocomplete="off">
<div class="zony" id="zony"></div>
<div class="sort" id="sort"><button data-s="new">Сначала новые</button><button data-s="old">Старые</button><button data-s="az">А–Я</button><button data-s="html">HTML</button></div></header>
<main id="m"><div class="pusto">Открываю…</div></main>
<div id="okno"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp; if(tg){tg.ready();tg.expand();}
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=[], K=null, zona="", kesh={}, sort=localStorage.getItem("sort")||"new";
const data=t=>{const d=new Date(t*1000);return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");};
function b64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function otkryt(url){const b=new Uint8Array(await (await fetch(url,{cache:"no-cache"})).arrayBuffer());
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},K,b.slice(12));}
async function kartinka(id,tip){if(!kesh[id])kesh[id]=otkryt("i/"+id+".bin").then(a=>URL.createObjectURL(new Blob([a],{type:tip||"image/jpeg"})));return kesh[id];}
const nab=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;nab.unobserve(e.target);
  kartinka(e.target.dataset.id).then(u=>e.target.style.backgroundImage=`url(${u})`).catch(()=>{});}),{rootMargin:"300px"});
function ris(){
  const q=$("#q").value.trim().toLowerCase();
  document.querySelectorAll("#zony button").forEach(b=>b.classList.toggle("on",b.dataset.z===zona));
  document.querySelectorAll("#sort button").forEach(b=>b.classList.toggle("on",b.dataset.s===sort));
  const L=D.map((k,i)=>[k,i]).filter(([k])=>(!zona||k.z===zona)&&(sort!=="html"||k.h)&&(!q||(k.t+" "+k.w+" "+k.tags.join(" ")+" "+k.d).toLowerCase().includes(q)));
  L.sort(([a],[b])=>sort==="old"?a.dt-b.dt:sort==="az"?a.t.localeCompare(b.t,"ru"):b.dt-a.dt);
  $("#n").textContent=L.length;
  $("#m").innerHTML=L.length?L.map(([k,i])=>`<div class="k" data-i="${i}"><div class="im" data-id="${k.i}"></div><div class="t">${esc(k.t)}<div class="z">${esc(k.z)} · ${data(k.dt)}${k.h?" · <b>HTML</b>":""}${(k.hz||k.v)?" · <b>▶</b>":""}</div></div></div>`).join(""):'<div class="pusto">Ничего не нашлось</div>';
  document.querySelectorAll(".im[data-id]").forEach(e=>e.dataset.id&&nab.observe(e));
}
async function pokaz(k){
  $("#okno").innerHTML=`${k.hz?'<div id="zh"><div class="zhd">Загружаю сцену…</div></div>':k.v?'<video id="vid" autoplay muted loop playsinline controls></video>':'<img id="bol">'}<h2>${esc(k.t)}</h2><p>${esc(k.w)}</p><div class="tg">${esc(k.z)} · ${k.tags.map(esc).join(" · ")}</div><button id="vzyat">✅ Взять за основу</button><button id="zakr">Закрыть</button>`;
  $("#okno").style.display="block";$("#okno").scrollTop=0;
  if(k.hz)zhivoy(k);
  else if(k.v){if(k.i)kartinka(k.i).then(u=>$("#vid")&&($("#vid").poster=u));
    kartinka(k.v,"video/mp4").then(u=>{const v=$("#vid");if(v){v.src=u;v.play().catch(()=>{});}});}
  else if(k.i)kartinka(k.i).then(u=>$("#bol")&&($("#bol").src=u));
  $("#zakr").onclick=zakr;
  $("#vzyat").onclick=()=>{const s=JSON.stringify({priem:k.d,t:k.t});
    if(tg&&tg.initData!==undefined&&tg.sendData){try{tg.sendData(s);return;}catch(e){}}
    navigator.clipboard&&navigator.clipboard.writeText("Возьми за основу приём «"+k.t+"» (ПРИЁМЫ/"+k.d+")");
    $("#vzyat").textContent="Скопировал – вставь Сене в чат";};
  if(tg){tg.BackButton.show();tg.BackButton.onClick(zakr);}
}
// живая сцена: HTML шаблона в рамке 1920×1080, каталог сам крутит seek(t) по таймеру, без звука (Антон 04.11)
let igra=0;
async function zhivoy(k){
  const moy=++igra, box=$("#zh");
  if(k.i)kartinka(k.i).then(u=>box&&(box.style.backgroundImage=`url(${u})`));
  let html;try{html=new TextDecoder().decode(await otkryt("i/"+k.hz+".bin"));}catch(e){box.querySelector(".zhd").textContent="Не открылась";return;}
  if(moy!==igra)return;
  const fr=document.createElement("iframe"), pol=document.createElement("div");pol.className="pol";
  const fit=()=>{fr.style.transform=`scale(${box.clientWidth/1920})`;};
  fr.srcdoc=html;box.append(fr,pol);fit();addEventListener("resize",fit);
  let t=0,last=null,pauza=false;
  box.onclick=()=>{pauza=!pauza;};
  const W=()=>fr.contentWindow, gotov=()=>{try{const w=W();return typeof w.seek==="function"&&(!w.SOLO||w.__ready===true);}catch(e){return false;}};
  const t0=performance.now();
  while(!gotov()&&performance.now()-t0<8000){await new Promise(r=>setTimeout(r,60));if(moy!==igra)return;}
  if(!gotov()){box.querySelector(".zhd").textContent="Сцена не запустилась";return;}
  box.querySelector(".zhd").remove();box.style.backgroundImage="none";
  (function f(now){if(moy!==igra)return;
    if(!pauza){if(last!==null)t+=(now-last)/1000;if(t>=k.L)t=0;}
    last=now;try{W().seek(t);}catch(e){}
    pol.style.width=(100*t/k.L)+"%";requestAnimationFrame(f);})(performance.now());
}
function zakr(){igra++;$("#okno").style.display="none";$("#okno").innerHTML="";if(tg)tg.BackButton.hide();}
(async()=>{
  try{const s=new URLSearchParams(location.search).get("k");if(!s)throw 0;
    K=await crypto.subtle.importKey("raw",b64(s),"AES-GCM",false,["decrypt"]);
    D=JSON.parse(new TextDecoder().decode(await otkryt("d.bin")));}
  catch(e){$("#m").innerHTML='<div class="pusto">Нет доступа</div>';return;}
  const zony=["",...new Set(D.map(k=>k.z).filter(Boolean))];
  $("#zony").innerHTML=zony.map(z=>`<button data-z="${esc(z)}">${esc(z||"все")}</button>`).join("");
  $("#zony").onclick=e=>{const b=e.target.closest("button");if(!b)return;zona=b.dataset.z;ris();};
  $("#sort").onclick=e=>{const b=e.target.closest("button");if(!b)return;sort=b.dataset.s;localStorage.setItem("sort",sort);ris();};
  $("#q").oninput=ris;
  $("#m").onclick=e=>{const c=e.target.closest(".k");if(c)pokaz(D[c.dataset.i]);};
  ris();
})();
</script></body></html>
